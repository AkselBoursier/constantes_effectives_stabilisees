# C7-C1 — M1 CPL w0waCDM : DESI DR2 BAO (13 composantes) + CMB comprimé.
# Transcription du YAML officiel
#   cobaya/base_w_wa/desi-bao-all_CMB-compressed-theta-ombh2-ombch2/chain.input.yaml
# (SHA-256 : 3EBBE59E2443652E78E3CC6F19B4A7B56F7DA0D69F4F22EF62D099FBCC619FB4).
# Adaptations minimales, toutes tracées dans manifests/ :
#   1. vraisemblances : bindings NERSC remplacés par la transcription
#      contrôlée locale scripts/c7c1_likelihoods.py ;
#   2. output supprimé (porte G1.0 : aucun échantillonnage, aucun produit) ;
#   3. AJOUT RATIFIÉ G0.6 : contrainte jointe explicite et auditable
#      w0 + wa < 0 (bloc « prior » ci-dessous), déclarée par l'analyse DESI
#      mais non sérialisée dans les YAML historiques (contrôle G0.5 :
#      0 violation sur 107 532 échantillons, max w0+wa = -0.7087) ;
#   4. python_path relatif : exécuter depuis la racine 01_REPRISE_... ;
#      les octets BAO sont fournis par la variable C7C1_DATA_DIR.
# Le bloc sampler est transcrit à l'identique mais NE DOIT PAS être lancé
# avant validation humaine du rapport G1.0 (issue #63).
theory:
  camb:
    extra_args:
      bbn_predictor: PArthENoPE_880.2_standard.dat
      dark_energy_model: ppf
      num_massive_neutrinos: 1
likelihood:
  c7c1_likelihoods.DesiBaoAll:
    python_path: ./scripts
  c7c1_likelihoods.CmbCompressedPR4:
    python_path: ./scripts
prior:
  # Condition de domination de la matière (DESI DR2, arXiv:2503.14738) :
  # log-prior 0 si w0 + wa < 0, -inf sinon. Prior explicite ratifié en G0.6.
  matter_domination_w0wa: 'lambda w, wa: 0.0 if (w + wa) < 0.0 else -np.inf'
params:
  logA:
    latex: \ln(10^{10} A_\mathrm{s})
    drop: true
    value: 3.036
  As:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_\mathrm{s}
  ns:
    latex: n_\mathrm{s}
    value: 0.9649
  H0:
    prior:
      min: 20
      max: 100
    ref:
      dist: norm
      loc: 67.36
      scale: 0.01
    latex: H_0
  ombh2:
    prior:
      min: 0.005
      max: 0.1
    ref:
      dist: norm
      loc: 0.02237
      scale: 0.0001
    proposal: 0.0001
    latex: \Omega_\mathrm{b} h^2
  omch2:
    value: 'lambda omm, mnu, ombh2, H0: omm*(H0/100)**2 - mnu / 93.14 - ombh2'
    latex: \Omega_\mathrm{c} h^2
  tau:
    latex: \tau_\mathrm{reio}
    value: 0.0544
  mnu:
    latex: \sum m_\nu
    value: 0.06
  nnu:
    latex: N_\mathrm{eff}
    value: 3.044
  w:
    prior:
      min: -3.0
      max: 1.0
    ref:
      dist: norm
      loc: -1.0
      scale: 0.02
    proposal: 0.02
    latex: w_{0}
  wa:
    prior:
      min: -3.0
      max: 2.0
    ref:
      dist: norm
      loc: 0.0
      scale: 0.05
    proposal: 0.05
    latex: w_{a}
  omk:
    latex: \Omega_\mathrm{k}
    value: 0.0
  omegam:
    latex: \Omega_\mathrm{m}
  omegamh2:
    derived: 'lambda omegam, H0: omegam*(H0/100)**2'
    latex: \Omega_\mathrm{m} h^2
  omegal:
    latex: \Omega_\Lambda
  zrei:
    latex: z_\mathrm{reio}
  YHe:
    latex: Y_\mathrm{P}
  Y_p:
    latex: Y_P^\mathrm{BBN}
  DHBBN:
    derived: 'lambda DH: 10**5*DH'
    latex: 10^5 \mathrm{D}/\mathrm{H}
  A:
    derived: 'lambda As: 1e9*As'
    latex: 10^9 A_\mathrm{s}
  clamp:
    derived: 'lambda As, tau: 1e9*As*np.exp(-2*tau)'
    latex: 10^9 A_\mathrm{s} e^{-2\tau}
  age:
    latex: \mathrm{Age}/\mathrm{Gyr}
  rdrag:
    latex: r_\mathrm{d}
  zdrag:
    latex: z_\mathrm{d}
  H0rdrag:
    derived: 'lambda H0, rdrag: H0 * rdrag'
    latex: H_0 r_\mathrm{d}
  omm:
    prior:
      min: 0.01
      max: 0.99
    ref:
      dist: norm
      loc: 0.3152
      scale: 0.001
    proposal: 0.0005
    drop: true
sampler:
  mcmc:
    drag: false
    oversample_power: 0.4
    proposal_scale: 1.9
    covmat: null
    temperature: 1
    Rminus1_stop: 0.01
    Rminus1_cl_stop: 0.02
    seed: null
    max_tries: 1000
